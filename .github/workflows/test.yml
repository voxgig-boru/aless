name: tests

# aless is written in boru (formerly AQL) and tracks boru MAIN (the boru:tui
# stack it needs postdates any tagged build), so CI builds the `boru` CLI from
# source at main on every run. An upstream regression can therefore break CI
# independently of any change here — the accepted trade-off for riding the
# latest boru:tui (see README.md / dx-report.md).
#
# boru main has ONE execution path: `boru X` checks, compiles to bytecode and
# runs on the VM (no interpreter fallback; `--force-compile` and friends are
# retired usage errors). The gate itself lives in test/divergence/run.sh — CI
# only builds boru and hands the binary over (BORU=…).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so an upstream boru-main regression is caught even without a push.
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out aless
        uses: actions/checkout@v4

      - name: Check out boru source (main)
        uses: actions/checkout@v4
        with:
          repository: boru-lang/boru
          ref: main
          path: boru-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boru-src/cmd/go/go.mod

      - name: Build boru (main)
        run: |
          mkdir -p "$HOME/.local/bin"
          ref="$(git -C boru-src rev-parse --short HEAD)"
          cd boru-src/cmd/go
          # GOWORK=off: the boru repo ships a go.work, so disable workspace
          # mode; GOFLAGS=-mod=mod then builds the standalone clone.
          GOWORK=off GOFLAGS=-mod=mod go build \
            -ldflags "-X github.com/boru-lang/boru/cmd/go.Version=${ref}" \
            -o "$HOME/.local/bin/boru" ./boru
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/boru" -version

      - name: Gate (every suite compiled + green; every module and suite checks clean)
        run: BORU="$HOME/.local/bin/boru" test/divergence/run.sh
